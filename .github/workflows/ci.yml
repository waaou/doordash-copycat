name: My Door Dash Workflow


on:
  push:           # every time you push new commits
    branches:
      - main
  workflow_dispatch:  # and manually from the Actions tab

jobs:
  door-dash:          # name of the job
    runs-on: ubuntu-latest   # GitHub provides an Ubuntu VM

    steps:
      - uses: actions/checkout@v4

      - name: Print greeting
        run: echo "👋 Hello from Jedha!"

      - name: Build Docker image
        run: |
          docker build -t my-app:${{ github.sha }} .
    
      - name: Start Docker container
        run: |
          docker run -d --name my-app-container -p 8090:8090 my-app:${{ github.sha }}

      - name: State of Docker container
        run: |
          sleep 5
          docker ps -a | grep my-app-container

      - name: Test all endpoints
        run: |
          HTTP_CODE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/status/)
  
          echo "HTTP response code: $HTTP_CODE_STATUS"
          if [ "$HTTP_CODE_STATUS" -eq 200 ]; then
            echo "Endpoint OK (HTTP $HTTP_CODE_STATUS)"
          else
            echo "Endpoint KO (HTTP $HTTP_CODE_STATUS)"
            exit 1
          fi

          HTTP_CODE_CALCULATE_FEE=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST \
          http://localhost:8090/calculate_fee/ \
          -H "Content-Type: application/json" -d '{"distance_km": 10.5, "weight_kg": 2.0}')

          echo "HTTP_CODE_CALCULATE_FEE=$HTTP_CODE_CALCULATE_FEE"

          if [ "$HTTP_CODE_CALCULATE_FEE" != "200" ] && [ "$HTTP_CODE_CALCULATE_FEE" != "201" ]; then
            echo "Erreur : le endpoint /calculate_fee/ a retourné $HTTP_CODE_CALCULATE_FEE"
            exit 1
          fi


      - name: Stop Docker container
        run: |
          docker stop my-app-container
          docker rm my-app-container